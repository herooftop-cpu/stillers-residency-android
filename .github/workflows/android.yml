name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create launcher icon
        run: |
          python3 - <<'PY'
          import re, base64, pathlib
          svg = pathlib.Path('app/src/main/assets/logo.svg').read_text()
          m = re.search(r'base64,([^"\']+)', svg)
          if not m:
              raise SystemExit('Embedded logo image not found')
          out = pathlib.Path('app/src/main/res/drawable/ic_launcher.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base64.b64decode(m.group(1)))
          PY

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stillers-Residency-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
